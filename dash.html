<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
display:flex;
background:#f4f6f9;
}

/* Sidebar */

.sidebar{
width:220px;
background:#1e293b;
height:100vh;
color:white;
padding:20px;
}

.sidebar h2{
margin-bottom:30px;
}

.sidebar ul{
list-style:none;
}

.sidebar ul li{
padding:12px;
margin:8px 0;
background:#334155;
border-radius:6px;
cursor:pointer;
}

.sidebar ul li:hover{
background:#475569;
}

/* Main */

.main{
flex:1;
padding:20px;
}

/* Navbar */

.navbar{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
margin-bottom:20px;
}

/* Cards */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card h3{
margin-bottom:10px;
color:#64748b;
}

.card p{
font-size:24px;
font-weight:bold;
}

/* Chart */

.chart-container{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

</style>
</head>

<body>

<div class="sidebar">
<h2>Dashboard</h2>
<ul>
<li>Home</li>
<li>Analytics</li>
<li>Users</li>
<li>Orders</li>
<li>Settings</li>
</ul>
</div>

<div class="main">

<div class="navbar">
<h2>Admin Dashboard</h2>
</div>

<div class="cards">

<div class="card">
<h3>Total Users</h3>
<p>1,240</p>
</div>

<div class="card">
<h3>Revenue</h3>
<p>$8,540</p>
</div>

<div class="card">
<h3>Orders</h3>
<p>320</p>
</div>

<div class="card">
<h3>Growth</h3>
<p>18%</p>
</div>

</div>

<div class="chart-container">
<canvas id="myChart"></canvas>
</div>

</div>

<script>

const ctx = document.getElementById('myChart');

new Chart(ctx,{
type:'line',
data:{
labels:['Jan','Feb','Mar','Apr','May','Jun'],
datasets:[{
label:'Sales',
data:[12,19,8,15,22,30],
borderWidth:3,
borderColor:'#3b82f6',
fill:false
}]
},
options:{
responsive:true
}
});

</script>

</body>
</html>
